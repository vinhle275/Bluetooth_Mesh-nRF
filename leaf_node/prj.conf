CONFIG_NCS_SAMPLES_DEFAULTS=y

# ==== 1. KHÓA CHẾ ĐỘ BIÊN DỊCH TỐI ƯU DUNG LƯỢNG & ĐIỆN NĂNG ====
CONFIG_SIZE_OPTIMIZATIONS=y

# ==== 2. QUẢN LÝ NĂNG LƯỢNG ====
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_EXISTS=y

# Low frequency clock configuration: use internal RC oscillator (safe fallback for custom boards)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==== 3. CẤU HÌNH ĐỊNH TUYẾN LƯU TRỮ NVS ====
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y

# Cấu hình chung ứng dụng
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Leaf Node"
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HWINFO=y
CONFIG_DK_LIBRARY=y

# ==== 4. BLUETOOTH MESH CƠ BẢN ====
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Leaf Node"
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_RX_STACK_SIZE=2700
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_GATT_PROXY=y

# Hạ dòng tĩnh: Tắt Controller phụ trợ
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n

CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=n
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
CONFIG_BT_MESH_DK_PROV=y
CONFIG_BT_MESH_ONOFF_SRV=y
CONFIG_BT_MESH_CRPL=256
CONFIG_BT_MESH_MSG_CACHE_SIZE=64
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_KEY_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=4


# Cấu hình công suất phát RF lên tối đa +8 dBm để tín hiệu cực mạnh
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_TX_PWR_ANTENNA=-20

# Tăng stack size tránh tràn bộ nhớ gây treo chip
CONFIG_MAIN_STACK_SIZE=4096

# Sửa lỗi đồng bộ hàng đợi gửi tin BLE
CONFIG_BT_CONN_TX_NOTIFY_WQ=y

CONFIG_GPIO=y
CONFIG_WATCHDOG=n

# ==== 5. CẤU HÌNH LOG TỐI THIỂU CHO LEAF ====
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BT_MESH_ONOFF_CLI=y

# Tăng số lượng bộ đệm advertiser để đáp ứng chuỗi truyền lặp 7 gói tin
CONFIG_BT_MESH_ADV_BUF_COUNT=24

# ==== 7. ADC CONFIGURATION FOR BATTERY MONITORING ====
CONFIG_ADC=y

# Cấu hình Segmented Messages để tránh lỗi nghẽn context khi gửi/nhận
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=8
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=8

# Tối ưu cho nhan/sleep tren san pham thuc te nRF54L15
CONFIG_PM_PARTITION_SIZE_PROVISION=0

# Vô hiệu hóa phần cứng CryptoCell CC310 để chạy mượt mà trên Renode không có phần cứng này
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_CC3XX_BACKEND=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y
