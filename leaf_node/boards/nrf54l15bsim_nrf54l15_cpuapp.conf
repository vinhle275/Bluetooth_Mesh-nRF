# Disable SoftDevice Controller which is not supported on native host/x86 compilation
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_LL_SW_SPLIT=y

# Disable physical console/RTT backends
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# Disable physical HW flash partial erase configs since it is simulated in RAM
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=n

# Disable CryptoCell which is not supported on native simulator
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_CC3XX_BACKEND=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_HW_CC3XX=n

# Enable standard POSIX entropy generator
CONFIG_TEST_RANDOM_GENERATOR=y

# Enable GPIO emulation for dummy LEDs/buttons
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
