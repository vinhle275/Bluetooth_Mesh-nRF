# Disable SoftDevice Controller which is not supported on host compilation
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_LL_SW_SPLIT=y

# Disable physical console/RTT backends
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# Disable physical HW flash partial erase configs since it is simulated in RAM
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=n

# Disable CryptoCell which is not supported on native simulator
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_CC3XX_BACKEND=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_HW_CC3XX=n

# Enable standard POSIX entropy generator
CONFIG_TEST_RANDOM_GENERATOR=y

# Use legacy advertiser for compatibility on BabbleSim
CONFIG_BT_EXT_ADV=n

# Immediate logging to prevent log loss on simulation exit
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep simulation output lightweight: gateway is the only node expected to emit
# packet/accounting logs. Bluetooth Mesh internals stay quiet to avoid slowing
# down large 121/169-node simulations.
CONFIG_BT_MESH_LOG_LEVEL_WRN=y
CONFIG_BT_LOG_LEVEL_WRN=y

# Large network buffer scaling for simulation
CONFIG_BT_MESH_ADV_BUF_COUNT=128
CONFIG_BT_MESH_MSG_CACHE_SIZE=128
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=8
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=8

# Mesh bearer robustness for dense grid bursts. Relay retransmit only applies to
# stack-level relay nodes; application-level forwarding still uses model sends.
CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=2
CONFIG_BT_MESH_RELAY_RETRANSMIT_INTERVAL=40
