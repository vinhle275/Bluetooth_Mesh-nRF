################################################################################
# Application overlay - nrf54l15

CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=n
CONFIG_SPI_NOR=n
CONFIG_NVS=n
CONFIG_NVS_LOOKUP_CACHE=n
CONFIG_SETTINGS_NVS_NAME_CACHE=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS_SECTOR_COUNT=8
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=512
CONFIG_SETTINGS_ZMS_NAME_CACHE=y
CONFIG_SETTINGS_ZMS_NAME_CACHE_SIZE=512
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y

# ==== CẤU HÌNH XUNG NHỊP THẤP 32kHz CHUẨN NRF54L ====
# Dòng nRF54L sử dụng driver CLOCK_CONTROL_NRF2 để quản lý LFCLK
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Keep GRTC running on nRF54L15. Gateway normally stays awake for RX/scanning,
# but the controller/system timer should still use the nRF54L GRTC backend.
CONFIG_TICKLESS_KERNEL=y
CONFIG_NRF_GRTC_TIMER=y
CONFIG_NRF_GRTC_ALWAYS_ON=y
CONFIG_NRF_GRTC_START_SYSCOUNTER=y
CONFIG_NRF_GRTC_TIMER_AUTO_KEEP_ALIVE=y

# ==== CẤU HÌNH QUẢN LÝ RAM (RAM RETENTION) CHUẨN ====
# Bật tính năng lưu giữ trạng thái RAM khi ở chế độ nguồn thấp
CONFIG_RETAINED_MEM=y

# Runtime PM for non-radio peripherals. The gateway is not duty-cycled like
# leaves, but idle peripherals should still suspend automatically.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
