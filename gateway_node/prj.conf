CONFIG_NCS_SAMPLES_DEFAULTS=y

# Deferred logging helps improve LPN power consumption
# when friendship is established.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG=y
CONFIG_PRINTK=y

# Low frequency clock configuration: use internal RC oscillator (safe fallback for custom boards)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# General configuration
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Gateway Node"
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_HWINFO=y
CONFIG_DK_LIBRARY=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Gateway Node"
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_GATT_PROXY=y

# Increase RX stack size to avoid overflow during provisioning
CONFIG_BT_RX_STACK_SIZE=2700

# Disable unused Bluetooth features
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n

# Bluetooth Mesh configuration
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
CONFIG_BT_MESH_DK_PROV=y
CONFIG_BT_MESH_RELAY_ENABLED=y
CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=1
CONFIG_BT_MESH_RELAY_RETRANSMIT_INTERVAL=20
CONFIG_BT_MESH_CRPL=256
CONFIG_BT_MESH_MSG_CACHE_SIZE=64
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_KEY_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=4


# Bluetooth Mesh models
CONFIG_BT_MESH_ONOFF_SRV=y

# Cấu hình hệ thống Logger và RTT (giữ log tập trung tại gateway)
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

# Cấu hình mức LOG cho Bluetooth Mesh (Ẩn các log debug quét gói tin liên tục)
CONFIG_BT_MESH_LOG_LEVEL_INF=y
CONFIG_BT_MESH_NET_LOG_LEVEL_OFF=n

# Cấu hình phần cứng RF (Tăng lên công suất tối đa +8 dBm để sóng cực khỏe)
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_TX_PWR_ANTENNA=-20

# Tăng stack size tránh tràn bộ nhớ gây treo chip
CONFIG_MAIN_STACK_SIZE=4096

# Sửa lỗi đồng bộ hàng đợi gửi tin BLE trên nRF54L15
CONFIG_BT_CONN_TX_NOTIFY_WQ=y

# Tăng số lượng bộ đệm advertiser để tránh nghẽn
CONFIG_BT_MESH_ADV_BUF_COUNT=32

# Cấu hình Segmented Messages để tránh lỗi nghẽn context khi gửi/nhận
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=8
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=8

# Vô hiệu hóa phần cứng CryptoCell CC310 để chạy mượt mà trên Renode không có phần cứng này
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_CC3XX_BACKEND=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y
